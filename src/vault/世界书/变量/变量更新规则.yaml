---
变量更新规则:
  世界:
    当前日期:
      check:
        - 按剧情推进更新日期，格式如「亚特历 147 年 6 月 12 日」
    当前时间:
      check:
        - 每次事件推进、休息、旅行后更新，时间流逝需合理
    当前淫雾浓度:
      type: number
      range: 0~100
      check:
        - 随地点、时间、事件变化，淫雾浓度会影响浊化侵蚀强度
  队伍状态:
    食物量:
      type: number
      range: 0~200
      check:
        - 进食、采集、交易、消耗后更新
        - 每天至少消耗 1 点食物，进食事件额外消耗
    淫魔精液总存量:
      type: number
      range: 0~500
      check:
        - 采集、转移、使用淫魔精液时更新
  队伍人员.${姓名}:
    压力值:
      type: number
      range: 0~100
      check:
        - 压抑性欲的累积程度，随压抑、浊化侵蚀、亲密接触等事件变化
        - 长期压抑或受浊化侵蚀会升高，适当释放可降低
    精液存量:
      type: number
      check:
        - 积攒的精液量（ml），随射精、采集、转移等事件变化
    生命值:
      type: number
      range: 0~100
      check:
        - 受伤、治疗、休息后更新
    浊化等级:
      type: number
      range: 0~5
      check:
        - 淫欲污染的侵蚀程度，随浊化侵蚀事件升高，极少降低
  修女.${姓名}:
    淫魔精液量:
      type: number
      range: 0~100
      check:
        - 修女体内淫魔精液的积存量，随吸收、转化、释放变化
    机芯等级:
      type: number
      range: 0~5
      check:
        - 圣银机芯的等级，随升级或损毁事件变化
    身体耐受值:
      type: number
      range: 0~100
      check:
        - 身体对淫魔精液的耐受程度，随侵蚀、调养事件变化
