---
编年史维护:
  目标: 维护世界书中名为「编年史」的条目，按楼层顺序记录每段剧情的摘要，使你在早期楼层被隐藏后仍能记得完整剧情
  编号计算: 楼层号 ÷ 2 即为摘要编号（0 层是开场，1 层是玩家输入，此后奇数层是玩家、偶数层是 AI 回复）
  操作时机: 每次生成新的 assistant 回复（含 <sum> 标签）后，更新一次
  内容格式: 每行一条「【编号】摘要」，例如「【0】开场信息」「【1】第一段摘要」
  操作函数: |-
    以下函数全局可用，无需 import：
    - getCharWorldbookNames('current')：获取当前角色卡绑定的世界书名称
    - getWorldbook(worldbook_name)：读取世界书条目数组
    - replaceWorldbook(worldbook_name, entries)：写回世界书条目数组
    在条目数组中找到 name 为「编年史」的条目，更新其 content
  更新逻辑:
    - 若新编号已存在于编年史中、且后面存在更高编号：说明玩家回档重 roll，用新 <sum> 覆盖该编号，并删除所有更高编号的行
    - 否则：正常推进，把「【编号】<sum>」追加到末尾
